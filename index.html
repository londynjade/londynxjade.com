
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#d8afb9">
<title>Londyn Jade</title>

<style>
* { box-sizing: border-box; }

:root {
  --rose: #bd8795;
  --deep-rose: #8d5262;
  --cream: #fff5f3;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;
  padding: 28px 18px;
  display: grid;
  place-items: center;
  position: relative;
  isolation: isolate;
  overflow-x: hidden;
  font-family: Georgia, "Times New Roman", serif;
  background: #d8afb9;
}

/* Your actual photo fills the entire background */
body::before {
  content: "";
  position: fixed;
  inset: -2%;
  z-index: -2;
  background:
    url("londyn-photo.jpg") center 35% / cover no-repeat;
  transform: scale(1.02);
}

/* Pink color grade over the photo */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  background: linear-gradient(
    135deg,
    rgba(210, 145, 164, .39),
    rgba(255, 226, 231, .28),
    rgba(153, 95, 116, .30)
  );
  pointer-events: none;
}

/* Main glass card */
.card {
  position: relative;
  z-index: 1;
  isolation: isolate;
  width: min(100%, 430px);
  padding: 40px 26px 34px;
  text-align: center;
  color: var(--deep-rose);
  background: rgba(255, 244, 243, .78);
  border: 1.5px solid rgba(255, 255, 255, .95);
  border-radius: 23px;
  box-shadow: 0 15px 65px rgba(82, 39, 53, .15);
  backdrop-filter: blur(13px);
  -webkit-backdrop-filter: blur(13px);
}

.eyebrow {
  font-family: Arial, sans-serif;
  font-size: 11px;
  letter-spacing: 4px;
  line-height: 1.8;
  text-transform: uppercase;
}

/* Circular portrait */
.profile {
  width: 166px;
  height: 166px;
  max-width: 55vw;
  max-height: 55vw;
  margin: 26px auto 24px;
  border: 5px solid white;
  border-radius: 50%;
  overflow: hidden;
  box-shadow: 0 4px 22px rgba(117, 62, 78, .14);
  background: #e7c6ce;
}

.profile img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  object-position: center 27%;
}

h1 {
  margin: 8px 0 12px;
  font-size: clamp(39px, 10vw, 57px);
  font-weight: normal;
  line-height: 1.08;
  letter-spacing: -1.8px;
}

.heart-divider {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 13px;
  margin: 20px auto;
  font-size: 27px;
}

.heart-divider span {
  height: 1px;
  width: 28%;
  background: linear-gradient(90deg, transparent, #bd8795);
}

.heart-divider span:last-child {
  transform: rotate(180deg);
}

.subtitle {
  margin: 0;
  font-size: 21px;
  font-style: italic;
}

.button {
  display: block;
  margin-top: 34px;
  padding: 19px 14px;
  border-radius: 50px;
  background: var(--rose);
  color: white;
  text-decoration: none;
  font-family: Arial, sans-serif;
  font-size: 12px;
  letter-spacing: 4px;
  transition: transform .25s, background .25s;
}

.button:hover {
  background: #a96e7e;
  transform: translateY(-2px);
}

.footer {
  margin-top: 23px;
  font-size: 13px;
  letter-spacing: 3px;
}

/* Floating hearts and sparkles */
.decor {
  position: fixed;
  z-index: 0;
  pointer-events: none;
  user-select: none;
  color: rgba(255, 250, 250, .95);
  text-shadow: 0 0 13px rgba(255, 255, 255, .75);
  animation: float 5s ease-in-out infinite;
}

.heart {
  font-family: Georgia, serif;
  font-size: 30px;
}

.star {
  font-size: 28px;
  animation-name: twinkle;
  animation-duration: 3.5s;
}

.d1 { top: 8%; left: 8%; animation-delay: -.8s; }
.d2 { top: 19%; right: 10%; animation-delay: -2s; }
.d3 { top: 43%; left: 5%; animation-delay: -1.4s; }
.d4 { top: 55%; right: 7%; animation-delay: -.4s; }
.d5 { bottom: 16%; left: 12%; animation-delay: -2.5s; }
.d6 { bottom: 9%; right: 14%; animation-delay: -1s; }
.d7 { top: 31%; right: 18%; animation-delay: -1.8s; }
.d8 { bottom: 29%; left: 7%; animation-delay: -.3s; }

@keyframes float {
  0%, 100% { transform: translateY(0) rotate(-5deg); }
  50% { transform: translateY(-13px) rotate(5deg); }
}

@keyframes twinkle {
  0%, 100% { opacity: .45; transform: scale(.8); }
  50% { opacity: 1; transform: scale(1.15); }
}

@media (max-width: 420px) {
  .card { padding: 34px 22px 29px; }
  .profile { width: 145px; height: 145px; }
  .eyebrow { letter-spacing: 3px; }
  .subtitle { font-size: 19px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body>

<!-- Decorative elements behind the card -->
<span class="decor star d1">✦</span>
<span class="decor heart d2">♡</span>
<span class="decor star d3">✧</span>
<span class="decor heart d4">♡</span>
<span class="decor star d5">✦</span>
<span class="decor heart d6">♡</span>
<span class="decor star d7">✧</span>
<span class="decor heart d8">♡</span>

<main class="card">
  <div class="eyebrow">Welcome to my world</div>

  <div class="profile">
    <img src="londyn-photo.jpg"
         alt="Londyn Jade">
  </div>

  <h1>Londyn Jade</h1>

  <div class="heart-divider" aria-hidden="true">
    <span></span>♡<span></span>
  </div>

  <p class="subtitle">more of me ♡</p>

  <a class="button"
     href="https://link.me/londyn.jade"
     target="_blank"
     rel="noopener noreferrer">
    VIEW MORE ↗
  </a>

  <div class="footer">♡</div>
</main>

</body>
</html>
