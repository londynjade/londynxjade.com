
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Londyn Jade ♡</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --pink: #f6dce5;
      --white: #fffafc;
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      padding: 24px 16px;
      background: #d9aeba;
      color: var(--white);
      font-family: 'Montserrat', sans-serif;
    }

    /* Full-screen photo background */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      background-image: url("londyn-photo.jpg");
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      transform: scale(1.02);
    }

    /* Soft pink tint over the photo */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background: linear-gradient(
        135deg,
        rgba(247, 211, 226, 0.18),
        rgba(176, 103, 133, 0.12)
      );
      pointer-events: none;
    }

    /* Floating stars and hearts */
    .decoration {
      position: fixed;
      z-index: 0;
      color: rgba(255, 255, 255, 0.94);
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.65);
      pointer-events: none;
      user-select: none;
      animation: float 5s ease-in-out infinite;
    }

    .star {
      font-size: 23px;
    }

    .heart {
      font-size: 19px;
    }

    .d1 { top: 9%; left: 12%; animation-delay: 0s; }
    .d2 { top: 17%; right: 13%; animation-delay: 1s; }
    .d3 { top: 36%; left: 7%; animation-delay: 2s; }
    .d4 { top: 61%; right: 8%; animation-delay: 0.7s; }
    .d5 { bottom: 13%; left: 17%; animation-delay: 1.5s; }
    .d6 { bottom: 9%; right: 18%; animation-delay: 2.2s; }
    .d7 { top: 76%; left: 6%; animation-delay: 1.2s; }
    .d8 { top: 44%; right: 5%; animation-delay: 2.5s; }
    .d9 { top: 5%; left: 47%; animation-delay: 0.5s; }
    .d10 { bottom: 5%; left: 49%; animation-delay: 1.8s; }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
        opacity: 0.78;
      }
      50% {
        transform: translateY(-10px) rotate(8deg);
        opacity: 1;
      }
    }

    /* Main translucent glass rectangle */
    .card {
      width: min(440px, 100%);
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 39px 32px 35px;
      border: 1px solid rgba(255, 255, 255, 0.48);
      border-radius: 25px;

      /* Lighter transparency: more of your photo shows through */
      background: rgba(248, 222, 233, 0.20);
      -webkit-backdrop-filter: blur(7px);
      backdrop-filter: blur(7px);

      box-shadow:
        0 10px 40px rgba(88, 35, 57, 0.10),
        inset 0 0 22px rgba(255, 255, 255, 0.09);
    }

    /* Stars and hearts inside the glass rectangle */
    .card-decoration {
      position: absolute;
      color: rgba(255, 255, 255, 0.98);
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
      pointer-events: none;
      user-select: none;
      animation: float 4.5s ease-in-out infinite;
    }

    .c1 {
      top: 17px;
      left: 20px;
      font-size: 19px;
    }

    .c2 {
      top: 42px;
      right: 22px;
      font-size: 16px;
      animation-delay: 1s;
    }

    .c3 {
      top: 44%;
      left: 15px;
      font-size: 16px;
      animation-delay: 1.6s;
    }

    .c4 {
      top: 48%;
      right: 16px;
      font-size: 19px;
      animation-delay: 0.6s;
    }

    .c5 {
      bottom: 20px;
      left: 29px;
      font-size: 17px;
      animation-delay: 1.3s;
    }

    .c6 {
      bottom: 25px;
      right: 25px;
      font-size: 20px;
      animation-delay: 2s;
    }

    /* Circular portrait */
    .portrait {
      width: 112px;
      height: 112px;
      margin: 0 auto 23px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.92);
      box-shadow: 0 5px 20px rgba(75, 35, 53, 0.16);
      background: rgba(255, 255, 255, 0.12);
    }

    .portrait img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center 35%;
    }

    .welcome {
      margin-bottom: 9px;
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.96);
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 500;
      font-size: clamp(39px, 8vw, 53px);
      line-height: 1.08;
      letter-spacing: 0.3px;
      text-shadow: 0 2px 15px rgba(95, 47, 65, 0.13);
    }

    .subtitle {
      margin-top: 12px;
      margin-bottom: 28px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 21px;
      font-style: italic;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.97);
    }

    /* Link button */
    .view-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      min-width: 175px;
      padding: 14px 22px;
      border: 1px solid rgba(255, 255, 255, 0.88);
      border-radius: 2px;
      color: #fff;
      text-decoration: none;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 2.7px;
      background: rgba(255, 255, 255, 0.10);
      transition: background 0.25s ease, transform 0.25s ease;
    }

    .view-button:hover {
      background: rgba(255, 255, 255, 0.23);
      transform: translateY(-2px);
    }

    .arrow {
      font-size: 17px;
      line-height: 10px;
      font-weight: 300;
      letter-spacing: 0;
    }

    .footer {
      margin-top: 23px;
      font-size: 9px;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.90);
    }

    /* Smaller, more compact card on mobile */
    @media (max-width: 600px) {
      body {
        padding: 18px 24px;
      }

      .card {
        width: min(310px, 100%);
        padding: 28px 22px 25px;
        border-radius: 21px;
        background: rgba(248, 222, 233, 0.16);
        -webkit-backdrop-filter: blur(5px);
        backdrop-filter: blur(5px);
      }

      .portrait {
        width: 88px;
        height: 88px;
        margin-bottom: 17px;
      }

      .welcome {
        font-size: 9px;
        letter-spacing: 3px;
        margin-bottom: 7px;
      }

      h1 {
        font-size: clamp(35px, 10vw, 43px);
      }

      .subtitle {
        margin-top: 9px;
        margin-bottom: 21px;
        font-size: 19px;
      }

      .view-button {
        min-width: 160px;
        padding: 12px 17px;
        gap: 12px;
        font-size: 9px;
      }

      .footer {
        margin-top: 17px;
        font-size: 8px;
      }

      .star {
        font-size: 20px;
      }

      .heart {
        font-size: 16px;
      }

      .d1 { top: 8%; left: 8%; }
      .d2 { top: 13%; right: 8%; }
      .d3 { top: 36%; left: 5%; }
      .d4 { top: 62%; right: 5%; }
      .d5 { bottom: 12%; left: 9%; }
      .d6 { bottom: 8%; right: 10%; }
      .d7 { top: 78%; left: 4%; }
      .d8 { top: 47%; right: 3%; }
      .d9 { top: 5%; left: 47%; }
      .d10 { bottom: 4%; left: 49%; }

      .c1 { top: 12px; left: 13px; font-size: 16px; }
      .c2 { top: 27px; right: 14px; font-size: 14px; }
      .c3 { left: 10px; font-size: 14px; }
      .c4 { right: 10px; font-size: 16px; }
      .c5 { bottom: 13px; left: 16px; font-size: 15px; }
      .c6 { bottom: 15px; right: 16px; font-size: 17px; }
    }

    @media (max-height: 650px) {
      .card {
        padding-top: 22px;
        padding-bottom: 20px;
      }

      .portrait {
        width: 76px;
        height: 76px;
        margin-bottom: 13px;
      }

      .subtitle {
        margin-bottom: 17px;
      }

      .footer {
        margin-top: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <!-- Floating decorations around the page -->
  <span class="decoration star d1">✧</span>
  <span class="decoration heart d2">♡</span>
  <span class="decoration star d3">✦</span>
  <span class="decoration heart d4">♡</span>
  <span class="decoration star d5">✧</span>
  <span class="decoration heart d6">♥</span>
  <span class="decoration heart d7">♡</span>
  <span class="decoration star d8">✧</span>
  <span class="decoration star d9">✦</span>
  <span class="decoration heart d10">♡</span>

  <main class="card">
    <!-- Decorations inside the rectangle -->
    <span class="card-decoration c1">✧</span>
    <span class="card-decoration c2">♡</span>
    <span class="card-decoration c3">✦</span>
    <span class="card-decoration c4">♡</span>
    <span class="card-decoration c5">✧</span>
    <span class="card-decoration c6">♥</span>

    <div class="portrait">
      <img src="londyn-photo.jpg" alt="Londyn Jade">
    </div>

    <p class="welcome">Welcome to my world</p>
    <h1>Londyn Jade</h1>
    <p class="subtitle">more of me ♡</p>

    <a
      class="view-button"
      href="https://link.me/londyn.jade"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span>VIEW MORE</span>
      <span class="arrow">→</span>
    </a>

    <p class="footer">WITH LOVE, LONDYN ♡</p>
  </main>
</body>
</html>
