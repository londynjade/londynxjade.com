
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e8d4d8">
  <title>Londyn Jade</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Georgia, "Times New Roman", serif;
      background-color: #d9c2c7;
      background-image:
        linear-gradient(#20171935, #20171955),
        url("YOUR-PHOTO-URL");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #5b4048;
    }

    .card {
      width: 100%;
      max-width: 390px;
      padding: 48px 28px 36px;
      text-align: center;
      background: rgba(255, 249, 247, 0.91);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 18px;
      box-shadow: 0 15px 55px rgba(30, 15, 20, 0.15);
      backdrop-filter: blur(8px);
    }

    .eyebrow {
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    h1 {
      margin: 22px 0 12px;
      font-size: clamp(36px, 9vw, 49px);
      font-weight: normal;
      letter-spacing: -1px;
    }

    .subtitle {
      margin: 0;
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    .button {
      display: block;
      margin-top: 32px;
      padding: 17px 20px;
      border-radius: 3px;
      background: #bd929d;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 3px;
      text-decoration: none;
      transition: background 0.2s ease;
    }

    .button:hover {
      background: #986d79;
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      opacity: 0.75;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Welcome to my world</div>
    <h1>Londyn Jade</h1>
    <p class="subtitle">a little more about me ♡</p>

    <a class="button"
       href="YOUR-LINKME-URL"
       target="_blank"
       rel="noopener noreferrer">
      VIEW MORE ↗
    </a>

    <div class="footer">♡</div>
  </main>
</body>
</html>
