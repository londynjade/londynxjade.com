
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#d8afb9">
<title>Londyn Jade</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --rose: #bd8795;
  --deep-rose: #8d5262;
  --white: #fffdfd;
}

html {
  min-height: 100%;
  background: #d8afb9;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;
  padding: 28px 18px;
  display: grid;
  place-items: center;
  position: relative;
  isolation: isolate;
  overflow-x: hidden;
  font-family: Georgia, "Times New Roman", serif;
  background: #d8afb9;
  color: var(--deep-rose);
}

/* Full-screen background photo */
body::before {
  content: "";
  position: fixed;
  inset: -2%;
  z-index: -2;
  background-image: url("londyn-photo.jpg");
  background-size: cover;
  background-position: center 35%;
  background-repeat: no-repeat;
  transform: scale(1.02);
}

/* Soft rosy color grade */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background: linear-gradient(
    135deg,
    rgba(210, 145, 164, .40),
    rgba(255, 226, 231, .28),
    rgba(153, 95, 116, .30)
  );
}

/* Main translucent card */
.card {
  position: relative;
  z-index: 1;
  isolation: isolate;
  width: min(100%, 460px);
  padding: 43px 30px 34px;
  text-align: center;
  color: var(--deep-rose);
  background: rgba(255, 225, 232, .62);
  border: 1.5px solid rgba(255, 255, 255, .95);
  border-radius: 23px;
  box-shadow: 0 15px 65px rgba(82, 39, 53, .16);
  backdrop-filter: blur(13px);
  -webkit-backdrop-filter: blur(13px);
}

.eyebrow {
  font-family: Arial, sans-serif;
  font-size: 11px;
  letter-spacing: 4px;
  line-height: 1.8;
  text-transform: uppercase;
}

/* Profile portrait */
.profile {
  width: 166px;
  height: 166px;
  margin: 25px auto 23px;
  border: 5px solid #fffdfd;
  border-radius: 50%;
  overflow: hidden;
  background: #e7c6ce;
  box-shadow: 0 4px 22px rgba(117, 62, 78, .18);
}

.profile img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 27%;
}

h1 {
  margin: 8px 0 10px;
  font-size: clamp(39px, 8vw, 57px);
  font-weight: normal;
  line-height: 1.08;
  letter-spacing: -1.8px;
}

.heart-divider {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 13px;
  margin: 17px auto;
  font-size: 27px;
  color: #b7798a;
}

.heart-divider span {
  width: 28%;
  height: 1px;
  background: linear-gradient(90deg, transparent, #bd8795);
}

.heart-divider span:last-child {
  transform: rotate(180deg);
}

.subtitle {
  margin: 0;
  font-size: 21px;
  font-style: italic;
}

/* VIEW MORE button */
.button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  margin-top: 32px;
  padding: 18px 14px;
  border-radius: 50px;
  background: var(--rose);
  color: white;
  text-decoration: none;
  font-family: Arial, sans-serif;
  font-size: 12px;
  letter-spacing: 4px;
  transition: transform .25s, background .25s;
}

.button:hover {
  background: #a96e7e;
  transform: translateY(-2px);
}

.button svg {
  display: block;
  flex-shrink: 0;
}

.footer {
  margin-top: 22px;
  font-size: 13px;
  letter-spacing: 3px;
}

/* Floating screen decorations */
.decor {
  position: fixed;
  z-index: 2;
  pointer-events: none;
  user-select: none;
  color: #fffdfd;
  text-shadow: 0 0 12px rgba(255, 255, 255, .9);
  animation: float 5s ease-in-out infinite;
}

.decor.heart {
  font-family: Georgia, serif;
  font-size: 30px;
}

.decor.star {
  font-size: 27px;
  animation-name: twinkle;
  animation-duration: 3.5s;
}

.d1 { top: 7%; left: 7%; animation-delay: -.8s; }
.d2 { top: 15%; right: 8%; animation-delay: -2s; }
.d3 { top: 42%; left: 4%; animation-delay: -1.4s; }
.d4 { top: 48%; right: 5%; animation-delay: -.4s; }
.d5 { bottom: 13%; left: 10%; animation-delay: -2.5s; }
.d6 { bottom: 8%; right: 12%; animation-delay: -1s; }
.d7 { top: 29%; right: 13%; animation-delay: -1.8s; }
.d8 { bottom: 25%; left: 5%; animation-delay: -.3s; }

/* Tiny decorations on the card */
.card-sparkle {
  position: absolute;
  z-index: 3;
  pointer-events: none;
  user-select: none;
  color: #fffdfd;
  text-shadow: 0 0 10px rgba(255, 255, 255, .9);
  animation: twinkle 3s ease-in-out infinite;
}

.card-sparkle.heart {
  font-size: 26px;
}

.card-sparkle.star {
  font-size: 23px;
}

.cs1 { top: 28%; left: 7%; }
.cs2 { top: 32%; right: 7%; animation-delay: -1s; }
.cs3 { top: 42%; left: 12%; animation-delay: -1.5s; }
.cs4 { top: 45%; right: 12%; animation-delay: -.5s; }

@keyframes float {
  0%, 100% {
    transform: translateY(0) rotate(-5deg);
  }
  50% {
    transform: translateY(-13px) rotate(5deg);
  }
}

@keyframes twinkle {
  0%, 100% {
    opacity: .55;
    transform: scale(.85);
  }
  50% {
    opacity: 1;
    transform: scale(1.12);
  }
}

/* Compact mobile layout */
@media (max-width: 420px) {
  body {
    padding: 16px 13px;
  }

  .card {
    width: 100%;
    max-width: 340px;
    padding: 23px 19px 20px;
    border-radius: 19px;
  }

  .eyebrow {
    font-size: 9px;
    letter-spacing: 2.5px;
  }

  .profile {
    width: 112px;
    height: 112px;
    margin: 15px auto 15px;
    border-width: 4px;
  }

  h1 {
    font-size: clamp(34px, 9vw, 41px);
    margin: 5px 0 7px;
    letter-spacing: -1px;
  }

  .heart-divider {
    margin: 10px auto;
    font-size: 22px;
    gap: 10px;
  }

  .subtitle {
    font-size: 18px;
  }

  .button {
    margin-top: 22px;
    padding: 15px 10px;
    font-size: 10px;
    letter-spacing: 3px;
    gap: 9px;
  }

  .footer {
    margin-top: 13px;
  }

  /* Keep decorations visible around the smaller card */
  .decor.heart {
    font-size: 25px;
  }

  .decor.star {
    font-size: 22px;
  }

  .d1 { top: 3%; left: 5%; }
  .d2 { top: 9%; right: 4%; }
  .d3 { top: 36%; left: 2%; }
  .d4 { top: 43%; right: 2%; }
  .d5 { bottom: 7%; left: 5%; }
  .d6 { bottom: 4%; right: 7%; }
  .d7 { top: 22%; right: 3%; }
  .d8 { bottom: 23%; left: 2%; }

  .card-sparkle.heart {
    font-size: 20px;
  }

  .card-sparkle.star {
    font-size: 18px;
  }

  .cs1 { top: 27%; left: 4%; }
  .cs2 { top: 30%; right: 4%; }
  .cs3 { top: 43%; left: 8%; }
  .cs4 { top: 46%; right: 8%; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body>

<!-- Floating white stars and hearts -->
<span class="decor star d1">✦</span>
<span class="decor heart d2">♡</span>
<span class="decor star d3">✧</span>
<span class="decor heart d4">♡</span>
<span class="decor star d5">✦</span>
<span class="decor heart d6">♡</span>
<span class="decor star d7">✧</span>
<span class="decor heart d8">♡</span>

<main class="card">

  <div class="eyebrow">Welcome to my world</div>

  <!-- White hearts and sparkles around your portrait -->
  <span class="card-sparkle heart cs1">♡</span>
  <span class="card-sparkle star cs2">✧</span>
  <span class="card-sparkle star cs3">✦</span>
  <span class="card-sparkle heart cs4">♡</span>

  <div class="profile">
    <img src="londyn-photo.jpg.jpg" alt="Londyn Jade">
  </div>

  <h1>Londyn Jade</h1>

  <div class="heart-divider" aria-hidden="true">
    <span></span>♡<span></span>
  </div>

  <p class="subtitle">more of me ♡</p>

  <a class="button"
     href="https://link.me/londyn.jade"
     target="_blank"
     rel="noopener noreferrer">
    VIEW MORE
    <svg width="14" height="14" viewBox="0 0 24 24"
         fill="none" stroke="currentColor"
         stroke-width="1.8" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true">
      <path d="M7 17 17 7"/>
      <path d="M7 7h10v10"/>
    </svg>
  </a>

  <div class="footer">♡</div>

</main>
</body>
</html>
